name: cleango_laundry
description: "CleanGo - Aplikasi Mobile Laundry Antar-Jemput (Pelanggan, Kurir, Admin)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0E7C7B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
